<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>请求主人恩准贱狗排精！——彻底的精奴调教</title>
<meta name="description" content="服从主人的指令，边缘、憋精、耻辱自慰……只有主人才能决定你这根贱狗鸡巴是否可以射精。" />
<link rel="stylesheet" href="minimize-css.css" />
<style>
#message { white-space: pre-line; word-break: break-word; line-height: 1.65; }
#timer {
  font-size: 18px;
  font-weight: bold;
  color: #ffcc00;
  margin: 12px 0;
  text-align: center;
  cursor: help;
  position: relative;
  display: inline-block;
  width: 100%;
}
#timerTip {
  display: none;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(100% + 6px);
  background: #222;
  color: #eee;
  border: 1px solid #666;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: normal;
  white-space: nowrap;
  z-index: 20;
  box-shadow: 0 4px 12px rgba(0,0,0,.35);
}
#timer:hover #timerTip,
#timer:focus-within #timerTip { display: block; }
#bootStatus { text-align: center; color: #888; font-size: 12px; margin-top: 6px; }
</style>
<script src="nosleep.js"></script>
<script src="minimize-js.js"></script>
<script src="game.js" defer></script>
</head>
<body>
<div id="mainwrapper">

<div id="choose">
<h2>请求主人恩准贱狗排精！</h2>
<div class="instructions">
<p><strong>贱狗注意：</strong>你正在请求主人彻底控制你的狗鸡巴、龟背、马眼、骚屁眼和前列腺。请诚实调整选项，严格服从每一条指令。</p>
<ul>
<li>深绿色时可以自慰，但绝不准射精。</li>
<li>暗红色时必须立即停止所有动作，双手拿开。</li>
<li>游戏会随机出现具体指令：摩擦龟背、刮马眼、插骚屁眼并勾前列腺、按压会阴等，带来强烈潮吹边缘感。</li>
<li>亮绿色时才被允许排精。</li>
<li>执行指令时动作要听话，耻辱感要足！</li>
</ul>
</div>
<form class="form-horizontal" onsubmit="return false;">
<div class="form-group">
<label class="col-sm-4 control-label">告诉主人：贱狗需要被控制的时长</label>
<div class="col-sm-8">
<select name="duration" class="selectpicker">
<option value="2">超级早泄废物（很短）</option>
<option value="7">早泄废物</option>
<option value="15" selected="selected">普通废物</option>
<option value="30">合格贱狗</option>
<option value="60">极品精奴贱狗</option>
</select>
</div>
</div>
<div class="form-group">
<label class="col-sm-4 control-label">告诉主人：排精任务的难度</label>
<div class="col-sm-8">
<select name="mode" class="selectpicker">
<option value="0">超级早泄废物</option>
<option value="1">早泄废物</option>
<option value="2" selected="selected">普通废物</option>
<option value="3">合格贱狗</option>
<option value="4">极品精奴贱狗</option>
</select>
</div>
</div>
<div class="form-group">
<label class="col-sm-4 control-label">告诉主人：贱狗是否渴望排精？</label>
<div class="col-sm-8">
<select name="cum" class="selectpicker" data-width="auto">
<option value="0" selected="selected">极品贱狗不被允许排精！</option>
<option value="0.2">如果表现不错，可以被奖励排精</option>
<option value="0.5">贱狗愿意服从主人任何指令</option>
<option value="0.8">请主人允许贱狗排精！</option>
<option value="0.95">贱狗愿意做任何下贱的事换取排精权利！</option>
</select>
</div>
</div>
<div class="form-group">
<label class="col-sm-4 control-label">告诉主人：是否使用飞机杯？</label>
<div class="col-sm-8">
<select name="fleshlight" class="selectpicker" data-width="auto">
<option value="0" selected="selected">否（纯手撸）</option>
<option value="1">是（使用飞机杯）</option>
</select>
</div>
</div>
<div class="form-group">
<div class="col-sm-4"></div>
<div class="col-sm-8">
<button type="submit" id="submit" class="btn btn-default btn-primary" style="margin-bottom:20px">开始调教任务</button>
</div>
</div>
</form>
<div id="bootStatus">加载中…</div>
</div>

<div id="gamewrapper" style="display:none">
<div id="image"></div>
<div id="flash" class="off" style="display:none"><span>自慰</span></div>
<div id="message"></div>

<div id="timer" tabindex="0" title="">
  已用时间: <span id="elapsed">00:00</span>
  <div id="timerTip">剩余约 <span id="remain">--:--</span> · 预估总长 <span id="targetTime">--:--</span></div>
</div>

<div id="progress">
  <div class="jerkbar">
    <div class="bar"></div>
    <div class="text">边缘</div>
  </div>
  <div class="cumbar">
    <div class="separator"></div>
    <div class="bar"></div>
    <div class="text">射精！</div>
  </div>
</div>
<div id="cumSoon">
  <div id="speed"></div>
</div>
</div>

</div>
</body>
</html>
