<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
<title>请求主人恩准贱狗排精！——彻底的精奴调教</title>
<meta name="description" content="服从主人的指令，边缘、憋精、耻辱自慰……只有主人才能决定你这根贱狗鸡巴是否可以射精。" />
<link rel="stylesheet" href="minimize-css.css" />
<style>
:root { --ui-scale: 1; }

#mainwrapper {
  font-size: calc(16px * var(--ui-scale));
}

#choose h2.title-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px 14px;
  margin: 12px 0 14px;
  font-size: calc(1.35rem * var(--ui-scale));
}
#choose h2.title-row .title-text { margin: 0; }
#btnVoiceLib {
  background: #333;
  color: #ffcc00;
  border: 1px solid #888;
  border-radius: 6px;
  padding: 4px 12px;
  cursor: pointer;
  font-size: calc(0.85rem * var(--ui-scale));
  font-weight: normal;
  vertical-align: middle;
}
#btnVoiceLib:hover { background: #444; }

#message {
  white-space: pre-line;
  word-break: break-word;
  line-height: 1.5;
  font-size: calc(1.28rem * var(--ui-scale));
  padding: 8px 6px;
}
#timer {
  font-size: calc(1.15rem * var(--ui-scale));
  font-weight: bold;
  color: #ffcc00;
  margin: 12px 0;
  text-align: center;
  cursor: help;
  position: relative;
}
#timerTip {
  display: none;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(100% + 6px);
  background: #222;
  color: #eee;
  border: 1px solid #666;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: calc(0.8rem * var(--ui-scale));
  font-weight: normal;
  white-space: nowrap;
  z-index: 20;
}
#timer:hover #timerTip,
#timer:focus-within #timerTip { display: block; }

#progress {
  max-width: calc(520px * var(--ui-scale));
  margin: 14px auto 0;
}
#progress .jerkbar,
#progress .cumbar {
  height: calc(36px * var(--ui-scale)) !important;
}
#progress .text {
  font-size: calc(0.95rem * var(--ui-scale)) !important;
}

#bootStatus { text-align: center; color: #888; font-size: 12px; margin-top: 8px; }
#packBar {
  max-width: 560px;
  margin: 8px auto 0;
  padding: 10px 12px;
  border: 1px dashed #666;
  border-radius: 8px;
  font-size: 13px;
  color: #ccc;
  text-align: left;
}
#packBar a { color: #ffcc00; }
#packBar .pack-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
#packBar input[type=file] { font-size: 12px; max-width: 100%; }
#packStatus { margin-top: 6px; color: #8c8; font-size: 12px; }
#packStatus.err { color: #e88; }
#packStatus.def { color: #888; }


/* scale control */
#scaleControl {
  position: fixed;
  right: 10px;
  bottom: 10px;
  z-index: 50;
  background: rgba(20,20,20,.88);
  border: 1px solid #555;
  border-radius: 8px;
  padding: 6px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #ccc;
}
#scaleControl button {
  width: 28px;
  height: 28px;
  border: 1px solid #666;
  border-radius: 4px;
  background: #333;
  color: #ffcc00;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}
#scaleControl button:hover { background: #444; }
#scaleValue { min-width: 36px; text-align: center; color: #ffcc00; }

/* voice library page */
#voiceLibPage {
  display: none;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 10px 40px;
}
#voiceLibPage.open { display: block; }
#voiceLibPage .vl-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
#voiceLibPage h2 {
  margin: 0;
  font-size: calc(1.25rem * var(--ui-scale));
  color: #ffcc00;
}
#btnBackHome {
  background: #333;
  color: #eee;
  border: 1px solid #666;
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}
#btnBackHome:hover { background: #444; }
#voiceLibHint {
  font-size: calc(0.85rem * var(--ui-scale));
  color: #999;
  margin: 0 0 12px;
}
.vl-table {
  width: 100%;
  border-collapse: collapse;
  font-size: calc(0.92rem * var(--ui-scale));
  margin-bottom: 18px;
}
.vl-table caption {
  text-align: left;
  font-weight: bold;
  color: #ffcc00;
  padding: 8px 4px 6px;
  font-size: calc(1rem * var(--ui-scale));
}
.vl-table th,
.vl-table td {
  border: 1px solid #444;
  padding: 8px 10px;
  vertical-align: middle;
  line-height: 1.4;
}
.vl-table th {
  background: #2a2a2a;
  color: #ccc;
  font-weight: 600;
  text-align: left;
}
.vl-table td.vl-idx {
  width: 52px;
  text-align: center;
  font-family: monospace;
  color: #aaa;
}
.vl-table td.vl-act {
  width: 56px;
  text-align: center;
}
.vl-table tr:nth-child(even) td { background: rgba(255,255,255,.03); }
.vl-play {
  height: 32px;
  width: 32px;
  border: none;
  border-radius: 50%;
  background: #2a2a2a;
  color: #ffcc00;
  cursor: pointer;
  font-size: 14px;
  line-height: 32px;
  padding: 0;
}
.vl-play:hover { background: #444; }
.vl-play.playing { background: #5a4010; color: #fff; }

.instructions { font-size: calc(0.95rem * var(--ui-scale)); }
.control-label { font-size: calc(0.9rem * var(--ui-scale)) !important; }
</style>
<!-- SheetJS CE: browser-side xlsx parse (no server upload) -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="nosleep.js"></script>
<script src="minimize-js.js"></script>
<script src="game.js" defer></script>
</head>
<body>
<div id="mainwrapper">

<div id="choose">
<h2 class="title-row">
  <span class="title-text">请求主人恩准贱狗排精！</span>
  <button type="button" id="btnVoiceLib">主人留音</button>
</h2>
<div class="instructions">
<p><strong>贱狗注意：</strong>你正在请求主人彻底控制你的狗鸡巴、龟背、马眼、骚屁眼和前列腺。请诚实调整选项，严格服从每一条指令。</p>
<ul>
<li>深绿色时可以自慰，但绝不准射精。</li>
<li>暗红色时必须立即停止所有动作，双手拿开。</li>
<li>游戏会随机出现具体指令：摩擦龟背、刮马眼、插骚屁眼并勾前列腺、按压会阴等，带来强烈潮吹边缘感。</li>
<li>亮绿色时才被允许排精。</li>
<li>执行指令时动作要听话，耻辱感要足！</li>
</ul>
</div>
<form class="form-horizontal" onsubmit="return false;">
<div class="form-group">
<label class="col-sm-4 control-label">告诉主人：贱狗需要被控制的时长</label>
<div class="col-sm-8">
<select name="duration" class="selectpicker">
<option value="2">超级早泄废物（很短）</option>
<option value="7">早泄废物</option>
<option value="15" selected="selected">普通废物</option>
<option value="30">合格贱狗</option>
<option value="60">极品精奴贱狗</option>
</select>
</div>
</div>
<div class="form-group">
<label class="col-sm-4 control-label">告诉主人：排精任务的难度</label>
<div class="col-sm-8">
<select name="mode" class="selectpicker">
<option value="0">超级早泄废物</option>
<option value="1">早泄废物</option>
<option value="2" selected="selected">普通废物</option>
<option value="3">合格贱狗</option>
<option value="4">极品精奴贱狗</option>
</select>
</div>
</div>
<div class="form-group">
<label class="col-sm-4 control-label">告诉主人：贱狗是否渴望排精？</label>
<div class="col-sm-8">
<select name="cum" class="selectpicker" data-width="auto">
<option value="0" selected="selected">极品贱狗不被允许排精！</option>
<option value="0.2">如果表现不错，可以被奖励排精</option>
<option value="0.5">贱狗愿意服从主人任何指令</option>
<option value="0.8">请主人允许贱狗排精！</option>
<option value="0.95">贱狗愿意做任何下贱的事换取排精权利！</option>
</select>
</div>
</div>
<div class="form-group">
<label class="col-sm-4 control-label">告诉主人：是否使用飞机杯？</label>
<div class="col-sm-8">
<select name="fleshlight" class="selectpicker" data-width="auto">
<option value="0" selected="selected">否（纯手撸）</option>
<option value="1">是（使用飞机杯）</option>
</select>
</div>
</div>
<div class="form-group">
<div class="col-sm-4"></div>
<div class="col-sm-8">
<button type="submit" id="submit" class="btn btn-default btn-primary" style="margin-bottom:12px">开始调教任务</button>
</div>
</div>
</form>
<div id="bootStatus">加载中…</div>
</div>

<div id="voiceLibPage">
  <div class="vl-header">
    <h2>主人留音</h2>
    <button type="button" id="btnBackHome">← 返回选项</button>
  </div>
  <p id="voiceLibHint">表格式对照全部语句与语音编号；点 ▶ 试听（不参与玩法）。</p>
  <div id="voiceLibBody"></div>
</div>

<div id="gamewrapper" style="display:none">
<div id="image"></div>
<div id="flash" class="off" style="display:none"><span>自慰</span></div>
<div id="message"></div>

<div id="timer" tabindex="0">
  已用时间: <span id="elapsed">00:00</span>
  <div id="timerTip">剩余约 <span id="remain">--:--</span> · 预估总长 <span id="targetTime">--:--</span></div>
</div>

<div id="progress">
  <div class="jerkbar">
    <div class="bar"></div>
    <div class="text">边缘</div>
  </div>
  <div class="cumbar">
    <div class="separator"></div>
    <div class="bar"></div>
    <div class="text">射精！</div>
  </div>
</div>
<div id="cumSoon">
  <div id="speed"></div>
</div>
</div>

</div>

<div id="scaleControl" title="界面缩放">
  <button type="button" id="scaleDown" aria-label="缩小">−</button>
  <span id="scaleValue">100%</span>
  <button type="button" id="scaleUp" aria-label="放大">+</button>
</div>
</body>
</html>
