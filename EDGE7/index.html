<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e12" />
<title>EDGE-Infinity</title>
<meta name="description" content="成人向边缘控制互动（18+）" />
<link rel="stylesheet" href="minimize-css.css" />
<link rel="stylesheet" href="game.css" />
<script src="nosleep.js"></script>
<script src="minimize-js.js"></script>
<script src="game.js" defer></script>
</head>
<body>
<div id="mainwrapper">

  <div id="ageGate" role="dialog" aria-labelledby="ageTitle" aria-modal="true">
    <h1 id="ageTitle">18+ 成人内容确认</h1>
    <div class="age-body">
      <p>本站包含明确的成人向性内容与控制类玩法，仅供年满 <strong>18 周岁</strong> 的用户使用。</p>
      <p>请确认：你已成年，并自愿使用本工具。可随时按页面底部的<strong>紧急停止</strong>或键盘 <kbd>Esc</kbd> 中止。</p>
    </div>
    <div class="age-actions">
      <button type="button" id="btnAgeYes">我已满 18 岁，进入</button>
      <button type="button" id="btnAgeNo">未满 18 岁 / 离开</button>
    </div>
  </div>

  <div id="choose" style="display:none">
    <h2>EDGE-Infinity</h2>
    <div class="instructions">
      <p><strong>说明：</strong>选择参数后开始。绿色阶段可刺激但不可提前结束；红色阶段必须立刻停手；最终阶段才可能被允许。</p>
      <ul>
        <li>紧急停止：底部红钮或 <kbd>Esc</kbd></li>
        <li>飞机杯选项会影响是否出现对应指令</li>
        <li>难度越高，高强度 / 边缘类指令权重越大</li>
      </ul>
    </div>
    <form class="form-horizontal" onsubmit="return false;">
      <div class="form-group">
        <label class="control-label">控制时长</label>
        <select name="duration" class="selectpicker">
          <option value="2">很短（约 2 分钟档）</option>
          <option value="7">短（约 7 分钟档）</option>
          <option value="15" selected>普通（约 15 分钟档）</option>
          <option value="30">长（约 30 分钟档）</option>
          <option value="60">很长（约 60 分钟档）</option>
        </select>
      </div>
      <div class="form-group">
        <label class="control-label">难度</label>
        <select name="mode" class="selectpicker">
          <option value="0">很轻松</option>
          <option value="1">轻松</option>
          <option value="2" selected>普通</option>
          <option value="3">困难</option>
          <option value="4">极难</option>
        </select>
      </div>
      <div class="form-group">
        <label class="control-label">最终释放倾向</label>
        <select name="cum" class="selectpicker" data-width="auto">
          <option value="0" selected>不允许释放</option>
          <option value="0.2">较低概率</option>
          <option value="0.5">中等</option>
          <option value="0.8">较高</option>
          <option value="0.95">很高</option>
        </select>
      </div>
      <div class="form-group">
        <label class="control-label">是否使用飞机杯</label>
        <select name="fleshlight" class="selectpicker" data-width="auto">
          <option value="0" selected>否（手）</option>
          <option value="1">是</option>
        </select>
      </div>
      <div class="form-group">
        <button type="submit" id="submit" class="btn btn-primary">开始</button>
      </div>
    </form>
    <div id="bootStatus">加载中…</div>
  </div>

  <div id="gamewrapper" style="display:none">
    <div id="image"></div>
    <div id="flash" class="off" aria-hidden="true"><span>节奏</span></div>
    <div id="message" role="status" aria-live="polite"></div>

    <div id="timerPanel">
      <div id="timerRow">
        <div>已用 <span class="val" id="elapsed">00:00</span></div>
        <div>剩余约 <span class="val" id="remain">--:--</span></div>
        <div>预估总长 <span class="val" id="targetTime">--:--</span></div>
      </div>
      <div id="sessionBar" aria-label="整局进度"><div class="bar"></div></div>
      <div id="phaseRow">
        <span id="phaseLabel">热身阶段</span>
        <div id="phaseDots" aria-hidden="true">
          <span class="dot" data-phase="warmup"></span>
          <span class="dot" data-phase="mid"></span>
          <span class="dot" data-phase="final"></span>
          <span class="dot" data-phase="end"></span>
        </div>
      </div>
    </div>

    <div id="progress">
      <div class="jerkbar">
        <div class="bar"></div>
        <div class="text">当前指令</div>
      </div>
      <div class="cumbar">
        <div class="separator"></div>
        <div class="bar"></div>
        <div class="text">最终阶段</div>
      </div>
    </div>

    <div id="cumSoon"><div id="speed"></div></div>
    <div id="cooldownTip" role="status"></div>
  </div>

  <button type="button" id="btnEmergency" style="display:none" aria-label="紧急停止">紧急停止 (Esc)</button>
</div>
</body>
</html>
